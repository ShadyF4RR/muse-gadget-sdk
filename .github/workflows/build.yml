- name: Build Firmware
        env:
          MUSE_SDK_TOKEN: ${{ secrets.MUSE_SDK_TOKEN }}
        run: |
          source ~/esp/esp-idf-v6/export.sh
          cd esp32
          
          # Inject token securely
          if [ -n "$MUSE_SDK_TOKEN" ]; then
            echo "CONFIG_GADGET_SDK_TOKEN=\"$MUSE_SDK_TOKEN\"" > sdkconfig.token
          fi

          # Use the repository's board wrapper script targeting the 1.8-inch S3 AMOLED profile
          ./tools/board.sh waveshare-s3-185c build
